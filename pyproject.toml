[project]
name = "vqvz"
version = "2.0.0"
description = "img.vqvz.com: a photoblog with Flickr as the backend"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "cachetools>=5.3",
  "python-dotenv>=1.0",  # lets `flask run` read FLICKR_API_KEY from .env
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
prod = ["gunicorn>=22"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vqvz"]

[tool.setuptools.package-data]
vqvz = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
