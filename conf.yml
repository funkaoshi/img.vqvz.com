:about: |
  <p>Right now this site is simply a nicer way to look at my photos on Flickr.
  At some point this site will present a selection of my photos from Flickr.
  Or maybe the site will do both of these things.</p>
  <p>You can browse through the photos on this site using the 'j' and 'k' keys 
  on your keyboard. 'j' will advance to the next photo (and if needed the next 
  page) and 'k' will move to the previous photo (and if needed the previous 
  page). This is similar to what you might have seen in use on the Boston 
  Globe's <a href="http://www.boston.com/bigpicture/">The Big Picture site</a>, 
  or in Gmail while browsing through your emails. You can read <a 
  href="http://funkaoshi.com/blog/img-vqvz">a much longer article on the 
  creation of this website over on at funkaoshi.com</a>.</p>
  <p>The site was built using <a href="http://www.sinatrarb.com/" 
  title="Sinatra">Sinatra</a>, a (simple) Ruby web framework. The goal was to 
  see if I can use Flickr as the backend for a photoblog. This is looking quite 
  likely. I will probably use this code as a starting point for another 
  project, <a href="http://blansdowne.ca">Bloor and Lansdowne is 
  Blansdowne.</a></p>
  <p>My previous photoblog was <a href="http://funkaoshi.com/abuse/">We Must 
  Abuse the Broadband</a>. It is missed.</p>
